<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>D·A·M·N 4K Promo Banner</title>
    <style>
        body {
            margin: 0;
            background: #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: auto;
        }

        /* EXACT SPECIFICATIONS: 4096px by 2304px */
        .canvas {
            width: 4096px;
            height: 2304px;
            background: #0B1220; /* Brand background */
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            box-sizing: border-box;
            flex-shrink: 0;
        }

        /* TEXT SECTION */
        .content {
            padding-left: 320px; /* Scaled 80 * 4 */
            z-index: 10;
            width: 2400px; /* Scaled 600 * 4 */
            flex-shrink: 0;
            pointer-events: none;
        }

        .logo {
            font-size: 520px; /* Scaled 130 * 4 */
            font-weight: 900;
            color: #FFFFFF;
            letter-spacing: 48px; /* Scaled 12 * 4 */
            margin: 0;
            text-shadow: 0 60px 160px rgba(0,0,0,0.6);
            line-height: 0.9;
        }

        .subtitle {
            font-size: 128px; /* Scaled 32 * 4 */
            color: #38BDF8; /* Brand accent blue */
            font-weight: 700;
            margin-top: 40px;
            letter-spacing: 2px;
        }

        .tagline {
            font-size: 168px; /* Scaled 42 * 4 */
            color: #94A3B8;
            font-weight: 300;
            margin-top: 80px;
            letter-spacing: 4px;
        }

        /* MOCKUP SECTION */
        .mockups {
            width: 1696px; /* Remaining space */
            position: relative;
            height: 100%;
            flex-shrink: 0;
        }

        .phone {
            width: 1040px; /* Scaled 260 * 4 */
            height: 2240px; /* Scaled 560 * 4 */
            background: #000;
            border: 48px solid #1E293B; /* Scaled 12 * 4 */
            border-radius: 176px; /* Scaled 44 * 4 */
            position: absolute;
            top: 32px;
            overflow: hidden;
            box-shadow: -160px 160px 320px rgba(0,0,0,0.9);
        }

        .phone img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Top phone - behind */
        .p1 {
            transform: rotate(-12deg) translateX(-400px) translateY(160px);
            z-index: 1;
            opacity: 0.7;
        }

        /* Bottom phone - focal point */
        .p2 {
            transform: rotate(-6deg) translateX(160px) translateY(80px);
            z-index: 2;
            border-color: #38BDF8; /* Accent border on primary mockup */
        }

        /* Glow effects for depth */
        .glow {
            position: absolute;
            width: 3200px;
            height: 3200px;
            background: radial-gradient(circle, rgba(56,189,248,0.1) 0%, rgba(0,0,0,0) 70%);
            top: -1200px;
            right: -800px;
            z-index: 0;
        }

        .accent-flare {
            position: absolute;
            bottom: -200px;
            left: -200px;
            width: 1200px;
            height: 1200px;
            background: radial-gradient(circle, rgba(167,139,250,0.05) 0%, rgba(0,0,0,0) 70%);
            z-index: 0;
        }

        /* DEVELOPER CREDIT */
        .developer-info {
            position: absolute;
            bottom: 220px; /* Moved up slightly from 180 to avoid Play Store cutoff */
            left: 320px;
            z-index: 20;
        }

        .developer-text {
            font-size: 80px;
            color: rgba(255,255,255,0.4);
            font-weight: 500;
            letter-spacing: 4px;
        }
    </style>
</head>
<body>

    <div class="canvas">
        <div class="glow"></div>
        <div class="accent-flare"></div>

        <div class="content">
            <h1 class="logo">D·A·M·N</h1>
            <div class="subtitle">Drop Any Media Now</div>
            <div class="tagline">Secure Direct Hosting</div>
        </div>

        <div class="mockups">
            <!-- p1: Top phone (screenshot01) -->
            <div class="phone p1">
                <img src="screenshot01.jpg" alt="Screen 1">
            </div>

            <!-- p2: Bottom phone (screenshot02) -->
            <div class="phone p2">
                <img src="screenshot02.jpg" alt="Screen 2">
            </div>
        </div>

        <div class="developer-info">
            <div class="developer-text">Developed by Bryce Hudson</div>
        </div>
    </div>

</body>
</html>
