<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>D·A·M·N High-Res Promo Banner</title>
    <style>
        /* 4096 x 2304 - 16:9 Ultra High Res */
        body {
            margin: 0;
            padding: 0;
            background: #0B1220;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: auto;
        }

        .canvas {
            width: 4096px;
            height: 2304px;
            background: #0B1220;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            flex-shrink: 0;
        }

        /* GLOWS */
        .glow-main {
            position: absolute;
            width: 3000px;
            height: 3000px;
            background: radial-gradient(circle, rgba(56,189,248,0.12) 0%, rgba(11,18,32,0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
        }

        /* CONTENT */
        .content {
            position: relative;
            z-index: 10;
            text-align: center;
            margin-bottom: 100px;
        }

        .logo {
            font-size: 520px;
            font-weight: 900;
            color: #FFFFFF;
            letter-spacing: 40px;
            margin: 0;
            text-shadow: 0 40px 100px rgba(0,0,0,0.8);
            line-height: 1;
        }

        .subtitle {
            font-size: 140px;
            color: #38BDF8;
            font-weight: 700;
            margin-top: -20px;
            letter-spacing: 4px;
        }

        .tagline {
            font-size: 110px;
            color: #94A3B8;
            font-weight: 300;
            margin-top: 40px;
            letter-spacing: 2px;
        }

        /* MOCKUPS */
        .mockup-container {
            display: flex;
            justify-content: center;
            gap: 150px;
            z-index: 5;
            margin-top: 50px;
        }

        .phone {
            width: 700px;
            height: 1450px;
            background: #000;
            border: 35px solid #1E293B;
            border-radius: 120px;
            overflow: hidden;
            box-shadow: 0 100px 200px rgba(0,0,0,0.8);
            transform: translateY(0);
        }

        .phone.p1 { transform: rotate(-5deg) translateY(50px); }
        .phone.p2 { transform: rotate(5deg) translateY(-50px); border-color: #38BDF8; }

        .phone img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* DEVELOPER CREDIT */
        .developer-info {
            position: absolute;
            bottom: 180px; /* Moved up a bit as requested to avoid cutoff */
            width: 100%;
            text-align: center;
            z-index: 20;
        }

        .developer-text {
            font-size: 70px;
            color: rgba(255,255,255,0.4);
            font-weight: 500;
            letter-spacing: 2px;
        }

    </style>
</head>
<body>

    <div class="canvas">
        <div class="glow-main"></div>

        <div class="content">
            <h1 class="logo">D·A·M·N</h1>
            <div class="subtitle">Drop Any Media Now</div>
            <div class="tagline">Secure Direct Hosting</div>
        </div>

        <div class="mockup-container">
            <div class="phone p1">
                <img src="screenshot01.jpg" alt="Screen 1">
            </div>
            <div class="phone p2">
                <img src="screenshot02.jpg" alt="Screen 2">
            </div>
        </div>

        <div class="developer-info">
            <div class="developer-text">Developed by Bryce Hudson</div>
        </div>
    </div>

</body>
</html>
